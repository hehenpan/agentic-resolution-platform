[server]
host = 0.0.0.0
port = 8000
debug = false
workers = 1
reload = false


[database]
db_file = data/db_prod.sqlite3

[auth]
session_expire_seconds = 2592000
session_cookie_secure = true

[storage]
storage_dir = data/files
storage_type = local

[ai_agent]
url = http://ai_agent:2024

[opentelemetry]
enabled = false
service_name = api_server
service_namespace = agentic-resolution-platform
exporter_otlp_endpoint = http://otel_collector:4317
exporter_otlp_protocol = grpc
exporter_otlp_insecure = true
traces_sampler = parentbased_traceidratio
traces_sampler_arg = 0.1
