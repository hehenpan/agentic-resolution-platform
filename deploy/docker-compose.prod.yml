version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: platform_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api_server
    networks:
      - platform-network

  frontend:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/frontend.prod.Dockerfile
    container_name: platform_frontend_prod
    ports:
      - "127.0.0.1:3000:3000"  # Secure loopback mapping (accessible on host only)
    # No volume mapping for code in production
    depends_on:
      - api_server
    networks:
      - platform-network

  api_server:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/api_server.Dockerfile
    container_name: platform_api_server_prod
    ports:
      - "127.0.0.1:8000:8000"  # Secure loopback mapping
    volumes:
      # Only mount database and uploads folder, DO NOT mount local code in production
      - ../data/prod/api_server:/app/data
    environment:
      - APP_ENV=prod
    depends_on:
      - ai_agent
      - otel_collector
    networks:
      - platform-network

  ai_agent:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/ai_agent.Dockerfile
    container_name: platform_ai_agent_prod
    ports:
      - "127.0.0.1:2024:2024"  # Secure loopback mapping
    volumes:
      # Only mount database checkpoints and vector DB, DO NOT mount local code
      - ../data/prod/ai_agent:/app/data
    environment:
      - APP_ENV=prod
      - AI_AGENT_LOG_DIR=/var/log/ai_agent
      - LOG_LEVEL=WARNING
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - POSTGRES_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - mcp_server
      - postgres
      - qdrant
    networks:
      - platform-network

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: platform_qdrant_prod
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ../data/prod/qdrant:/qdrant/storage
    networks:
      - platform-network

  mcp_server:
    build:
      context: ..
      dockerfile: deploy/dockerfiles/mcp_server.Dockerfile
    container_name: platform_mcp_server_prod
    ports:
      - "127.0.0.1:8500:8500"  # Secure loopback mapping
    volumes:
      # Only mount database, DO NOT mount local code
      - ../data/prod/mcp_server:/app/data
    environment:
      - APP_ENV=prod
    networks:
      - platform-network

  postgres:
    image: postgres:16-alpine
    container_name: platform_postgres_prod
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ../data/prod/postgres:/var/lib/postgresql/data
    networks:
      - platform-network

  otel_collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: platform_otel_collector_prod
    command: ["--config=/etc/otel-collector.yml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      - tempo
    networks:
      - platform-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: platform_tempo_prod
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./otel/tempo.yml:/etc/tempo.yml:ro
      - ../data/prod/tempo:/var/tempo
    networks:
      - platform-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: platform_grafana_prod
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ../data/prod/grafana:/var/lib/grafana
      - ./otel/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - tempo
    networks:
      - platform-network
    restart: unless-stopped

networks:
  platform-network:
    name: platform_network_prod
    driver: bridge
